<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6 - Registration Form with Validation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .form-card {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 20px;
      padding: 2.25rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border: 1px solid #f1f5f9;
    }

    .form-header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .form-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .form-subtitle {
      font-size: 0.9rem;
      color: #64748b;
    }

    .success-alert {
      display: none;
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-size: 0.925rem;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
    }

    .success-alert.visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .form-input {
      padding: 0.75rem 0.95rem;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #ffffff;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-input.input-error {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    .form-input.input-error:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .field-error-msg {
      font-size: 0.8rem;
      color: #dc2626;
      margin-top: 0.35rem;
      min-height: 18px;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .submit-btn,
      .success-alert {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>

  <main class="form-card">
    <header class="form-header">
      <h1 class="form-title">Create Account</h1>
      <p class="form-subtitle">Join us today. Please fill in your details below.</p>
    </header>

    <div id="successMessage" class="success-alert" role="status">
      &#10003; Registration successful! Your account has been registered.
    </div>

    <form id="registrationForm" novalidate>

      <div class="form-group">
        <label for="fullName" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          class="form-input" 
          placeholder="e.g. John Doe"
          autocomplete="name"
          aria-describedby="nameError"
        >
        <span id="nameError" class="field-error-msg" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="e.g. john@example.com"
          autocomplete="email"
          aria-describedby="emailError"
        >
        <span id="emailError" class="field-error-msg" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="At least 6 characters"
          autocomplete="new-password"
          aria-describedby="passwordError"
        >
        <span id="passwordError" class="field-error-msg" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          class="form-input" 
          placeholder="Re-enter your password"
          autocomplete="new-password"
          aria-describedby="confirmError"
        >
        <span id="confirmError" class="field-error-msg" role="alert"></span>
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>
  </main>

  <script>

    const form = document.getElementById('registrationForm');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const successMessage = document.getElementById('successMessage');

    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const confirmError = document.getElementById('confirmError');

    function setFieldError(inputEl, errorEl, message) {
      inputEl.classList.add('input-error');
      errorEl.textContent = message;
    }

    function clearFieldError(inputEl, errorEl) {
      inputEl.classList.remove('input-error');
      errorEl.textContent = '';
    }

    fullNameInput.addEventListener('input', () => clearFieldError(fullNameInput, nameError));
    emailInput.addEventListener('input', () => clearFieldError(emailInput, emailError));
    passwordInput.addEventListener('input', () => clearFieldError(passwordInput, passwordError));
    confirmPasswordInput.addEventListener('input', () => clearFieldError(confirmPasswordInput, confirmError));

    form.addEventListener('submit', (event) => {

      event.preventDefault();

      successMessage.classList.remove('visible');

      const nameVal = fullNameInput.value.trim();
      const emailVal = emailInput.value.trim();
      const passwordVal = passwordInput.value;
      const confirmVal = confirmPasswordInput.value;

      let isValid = true;

      if (!nameVal) {
        setFieldError(fullNameInput, nameError, 'Name cannot be empty.');
        isValid = false;
      } else {
        clearFieldError(fullNameInput, nameError);
      }

      if (!emailVal) {
        setFieldError(emailInput, emailError, 'Email cannot be empty.');
        isValid = false;
      } else if (!emailVal.includes('@') || !emailVal.includes('.')) {
        setFieldError(emailInput, emailError, "Email must contain '@' and a valid domain.");
        isValid = false;
      } else {
        clearFieldError(emailInput, emailError);
      }

      if (!passwordVal) {
        setFieldError(passwordInput, passwordError, 'Password cannot be empty.');
        isValid = false;
      } else if (passwordVal.length < 6) {
        setFieldError(passwordInput, passwordError, 'Password must contain at least 6 characters.');
        isValid = false;
      } else {
        clearFieldError(passwordInput, passwordError);
      }

      if (!confirmVal) {
        setFieldError(confirmPasswordInput, confirmError, 'Please confirm your password.');
        isValid = false;
      } else if (confirmVal !== passwordVal) {
        setFieldError(confirmPasswordInput, confirmError, 'Passwords do not match.');
        isValid = false;
      } else {
        clearFieldError(confirmPasswordInput, confirmError);
      }

      if (isValid) {

        successMessage.classList.add('visible');

        form.reset();

        clearFieldError(fullNameInput, nameError);
        clearFieldError(emailInput, emailError);
        clearFieldError(passwordInput, passwordError);
        clearFieldError(confirmPasswordInput, confirmError);
      }
    });
  </script>

</body>
</html>
