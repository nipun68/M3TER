<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 8 - Student Manager (Mini CRUD)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      padding: 2.5rem 1.25rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    .endpoint-badge {
      display: inline-block;
      margin-top: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825rem;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
    }

    .feedback-banner {
      display: none;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-size: 0.925rem;
      font-weight: 500;
      line-height: 1.4;
      animation: fadeIn 0.25s ease;
    }

    .feedback-banner.success {
      display: block;
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .feedback-banner.error {
      display: block;
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .feedback-banner.info {
      display: block;
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .crud-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    @media (max-width: 820px) {
      .crud-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
    }

    .form-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .form-input {
      padding: 0.7rem 0.85rem;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #ffffff;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .field-error {
      color: #dc2626;
      font-size: 0.775rem;
      margin-top: 0.3rem;
      min-height: 16px;
    }

    .form-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn-submit {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-cancel {
      display: none;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-cancel:hover {
      background-color: #e2e8f0;
    }

    .table-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
      overflow-x: auto;
    }

    .table-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .table-header-row h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .btn-refresh {
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-refresh:hover {
      background-color: #f1f5f9;
    }

    .students-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .students-table th {
      background-color: #f8fafc;
      color: #475569;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.85rem 1rem;
      border-bottom: 1.5px solid #e2e8f0;
    }

    .students-table td {
      padding: 1rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.925rem;
      color: #1e293b;
    }

    .students-table tr:hover td {
      background-color: #f8fafc;
    }

    .id-badge {
      font-family: ui-monospace, monospace;
      font-weight: 600;
      color: #64748b;
      font-size: 0.85rem;
    }

    .course-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2563eb;
      background-color: #eff6ff;
      border-radius: 6px;
    }

    .table-actions {
      display: flex;
      gap: 0.4rem;
    }

    .btn-edit,
    .btn-delete {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-edit {
      background-color: #f1f5f9;
      color: #2563eb;
    }

    .btn-edit:hover {
      background-color: #dbeafe;
    }

    .btn-delete {
      background-color: #fee2e2;
      color: #dc2626;
    }

    .btn-delete:hover {
      background-color: #fecaca;
    }

    .table-state-cell {
      text-align: center;
      padding: 3rem 1rem !important;
      color: #64748b;
    }

    @media (prefers-reduced-motion: reduce) {
      .feedback-banner,
      .btn-submit,
      .btn-cancel,
      .btn-edit,
      .btn-delete {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Student Manager</h1>
      <p>Demonstrating CRUD Operations (GET, POST, PATCH, DELETE) with JSON Server</p>
      <span class="endpoint-badge">Endpoint: http://localhost:3000/students</span>
    </header>

    <div id="feedbackBanner" class="feedback-banner" role="status"></div>

    <div class="crud-grid">

      <section class="form-card">
        <h2 id="formHeading">Add New Student</h2>
        <form id="studentForm" novalidate>
          <input type="hidden" id="editStudentId">

          <div class="form-group">
            <label for="studentName" class="form-label">Student Name</label>
            <input 
              type="text" 
              id="studentName" 
              class="form-input" 
              placeholder="e.g. Rahul Sharma"
              autocomplete="off"
            >
            <span id="nameError" class="field-error"></span>
          </div>

          <div class="form-group">
            <label for="studentCourse" class="form-label">Course / Major</label>
            <input 
              type="text" 
              id="studentCourse" 
              class="form-input" 
              placeholder="e.g. Computer Science"
              autocomplete="off"
            >
            <span id="courseError" class="field-error"></span>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn-submit">Add Student</button>
            <button type="button" id="cancelEditBtn" class="btn-cancel">Cancel</button>
          </div>
        </form>
      </section>

      <section class="table-card">
        <div class="table-header-row">
          <h2>Enrolled Students</h2>
          <button type="button" id="refreshBtn" class="btn-refresh" title="Reload from server">
            &#x21bb; Refresh Table
          </button>
        </div>

        <table class="students-table" aria-label="Students Table">
          <thead>
            <tr>
              <th scope="col" style="width: 70px;">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Course</th>
              <th scope="col" style="width: 140px;">Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr>
              <td colspan="4" class="table-state-cell">Loading students...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <script>

    const API_URL = 'http://localhost:3000/students';

    let studentsCache = [];
    let isEditing = false;
    let isSubmitting = false;

    const studentForm = document.getElementById('studentForm');
    const formHeading = document.getElementById('formHeading');
    const editStudentId = document.getElementById('editStudentId');
    const studentNameInput = document.getElementById('studentName');
    const studentCourseInput = document.getElementById('studentCourse');
    const nameError = document.getElementById('nameError');
    const courseError = document.getElementById('courseError');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const studentsTableBody = document.getElementById('studentsTableBody');
    const feedbackBanner = document.getElementById('feedbackBanner');

    const getStudents = async () => {
      const response = await fetch(API_URL);
      if (!response.ok) {
        throw new Error(`Failed to fetch students (HTTP ${response.status})`);
      }
      return await response.json();
    };

    const addStudent = async (studentData) => {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(studentData)
      });
      if (!response.ok) {
        throw new Error(`Failed to add student (HTTP ${response.status})`);
      }
      return await response.json();
    };

    const updateStudent = async (id, studentData) => {
      const response = await fetch(`${API_URL}/${id}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(studentData)
      });
      if (!response.ok) {
        throw new Error(`Failed to update student (HTTP ${response.status})`);
      }
      return await response.json();
    };

    const deleteStudent = async (id) => {
      const response = await fetch(`${API_URL}/${id}`, {
        method: 'DELETE'
      });
      if (!response.ok) {
        throw new Error(`Failed to delete student (HTTP ${response.status})`);
      }
      return await response.json();
    };

    let feedbackTimer = null;

    function showFeedback(type, message, persistent = false) {
      clearTimeout(feedbackTimer);
      feedbackBanner.className = `feedback-banner ${type}`;
      feedbackBanner.innerHTML = message;

      if (!persistent) {
        feedbackTimer = setTimeout(() => {
          feedbackBanner.className = 'feedback-banner';
          feedbackBanner.innerHTML = '';
        }, 5000);
      }
    }

    function clearFeedback() {
      clearTimeout(feedbackTimer);
      feedbackBanner.className = 'feedback-banner';
      feedbackBanner.innerHTML = '';
    }

    function setSubmitting(submitting) {
      isSubmitting = submitting;
      submitBtn.disabled = submitting;
      submitBtn.textContent = submitting 
        ? (isEditing ? 'Updating...' : 'Adding...') 
        : (isEditing ? 'Update Student' : 'Add Student');
    }

    async function loadStudents() {
      studentsTableBody.innerHTML = `
        <tr>
          <td colspan="4" class="table-state-cell">Loading students...</td>
        </tr>
      `;

      try {
        const students = await getStudents();
        studentsCache = students;

        if (students.length === 0) {
          studentsTableBody.innerHTML = `
            <tr>
              <td colspan="4" class="table-state-cell">No students found. Add a student using the form.</td>
            </tr>
          `;
          return;
        }

        studentsTableBody.innerHTML = students.map(student => `
          <tr data-id="${student.id}">
            <td><span class="id-badge">#${escapeHtml(String(student.id))}</span></td>
            <td><strong>${escapeHtml(student.name)}</strong></td>
            <td><span class="course-badge">${escapeHtml(student.course)}</span></td>
            <td>
              <div class="table-actions">
                <button type="button" class="btn-edit" data-id="${student.id}">Edit</button>
                <button type="button" class="btn-delete" data-id="${student.id}">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error in loadStudents:', err);
        studentsTableBody.innerHTML = `
          <tr>
            <td colspan="4" class="table-state-cell" style="color: #dc2626;">
              Unable to connect to JSON Server at <code>${API_URL}</code>.<br>
              Make sure JSON Server is running on port 3000: <br>
              <code>npx json-server --watch db.json --port 3000</code>
            </td>
          </tr>
        `;
        showFeedback(
          'error', 
          `<strong>Connection Error:</strong> Cannot reach ${API_URL}. Ensure JSON Server is running with: <code>npx json-server --watch db.json --port 3000</code>`,
          true
        );
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function startEdit(id) {
      const student = studentsCache.find(s => String(s.id) === String(id));
      if (!student) return;

      isEditing = true;
      editStudentId.value = student.id;
      studentNameInput.value = student.name;
      studentCourseInput.value = student.course;

      formHeading.textContent = `Edit Student #${student.id}`;
      submitBtn.textContent = 'Update Student';
      cancelEditBtn.style.display = 'inline-block';

      nameError.textContent = '';
      courseError.textContent = '';
      studentNameInput.focus();
    }

    function resetFormMode() {
      isEditing = false;
      editStudentId.value = '';
      studentForm.reset();

      formHeading.textContent = 'Add New Student';
      submitBtn.textContent = 'Add Student';
      cancelEditBtn.style.display = 'none';

      nameError.textContent = '';
      courseError.textContent = '';
    }

    studentForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (isSubmitting) return;

      const name = studentNameInput.value.trim();
      const course = studentCourseInput.value.trim();

      let hasError = false;
      if (!name) {
        nameError.textContent = 'Student name is required.';
        hasError = true;
      } else {
        nameError.textContent = '';
      }

      if (!course) {
        courseError.textContent = 'Course is required.';
        hasError = true;
      } else {
        courseError.textContent = '';
      }

      if (hasError) return;

      setSubmitting(true);

      try {
        if (isEditing) {

          const id = editStudentId.value;
          await updateStudent(id, { name, course });
          showFeedback('success', `Student #${id} updated successfully.`);
          resetFormMode();
        } else {

          const newStudent = {
            id: String(Date.now()),
            name,
            course
          };
          await addStudent(newStudent);
          showFeedback('success', `Student "${name}" added successfully.`);
          studentForm.reset();
        }

        await loadStudents();

      } catch (err) {
        console.error('Operation error:', err);
        showFeedback('error', `Operation failed: ${err.message}`);
      } finally {
        setSubmitting(false);
      }
    });

    cancelEditBtn.addEventListener('click', () => {
      resetFormMode();
      showFeedback('info', 'Edit cancelled.');
    });

    refreshBtn.addEventListener('click', () => {
      loadStudents();
    });

    studentsTableBody.addEventListener('click', async (event) => {
      const target = event.target;
      const id = target.getAttribute('data-id');
      if (!id) return;

      if (target.classList.contains('btn-edit')) {
        startEdit(id);
      } else if (target.classList.contains('btn-delete')) {
        const student = studentsCache.find(s => String(s.id) === String(id));
        const displayName = student ? student.name : `#${id}`;

        if (!confirm(`Are you sure you want to delete "${displayName}"?`)) {
          return;
        }

        try {
          target.disabled = true;
          target.textContent = 'Deleting...';
          await deleteStudent(id);
          showFeedback('success', `Student "${displayName}" deleted successfully.`);

          if (isEditing && editStudentId.value === String(id)) {
            resetFormMode();
          }

          await loadStudents();

        } catch (err) {
          console.error('Delete error:', err);
          showFeedback('error', `Failed to delete student: ${err.message}`);
          target.disabled = false;
          target.textContent = 'Delete';
        }
      }
    });

    studentNameInput.addEventListener('input', () => { nameError.textContent = ''; });
    studentCourseInput.addEventListener('input', () => { courseError.textContent = ''; });

    loadStudents();
  </script>

</body>
</html>
