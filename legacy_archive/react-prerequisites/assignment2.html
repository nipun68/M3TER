<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 2 - Counter App</title>
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      padding: 1.5rem;
    }

    .counter-card {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border: 1px solid #f1f5f9;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .counter-card:hover {
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.12);
    }

    .app-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    .value-display-wrapper {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .counter-value {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;

      color: #1e293b;
      transition: color 0.25s ease, transform 0.15s ease;
      display: inline-block;
    }

    .limit-alert {
      min-height: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ea580c;
      margin-bottom: 1.5rem;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .limit-alert.visible {
      opacity: 1;
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-decrease {
      background-color: #fee2e2;
      color: #dc2626;
    }

    .btn-decrease:hover {
      background-color: #fecaca;
    }

    .btn-reset {
      background-color: #f1f5f9;
      color: #475569;
    }

    .btn-reset:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }

    .btn-increase {
      background-color: #dcfce7;
      color: #16a34a;
    }

    .btn-increase:hover {
      background-color: #bbf7d0;
    }

    .btn-increase:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .badge {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
      background: #f8fafc;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn,
      .counter-value,
      .counter-card {
        transition: none;
      }
      .btn:active {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <main class="counter-card">
    <h1 class="app-title">Counter Application</h1>
    <p class="app-subtitle">Demonstrating State, DOM Updates &amp; Ternary Operators</p>

    <div class="value-display-wrapper">
      <span id="counterValue" class="counter-value" aria-live="polite">0</span>
    </div>

    <div id="limitAlert" class="limit-alert" role="status">Maximum limit of 10 reached</div>

    <div class="button-group">
      <button type="button" id="decreaseBtn" class="btn btn-decrease" aria-label="Decrease counter">
        &minus; Decrease
      </button>
      <button type="button" id="resetBtn" class="btn btn-reset" aria-label="Reset counter">
        Reset
      </button>
      <button type="button" id="increaseBtn" class="btn btn-increase" aria-label="Increase counter">
        + Increase
      </button>
    </div>

    <div class="badge">Rule: Max limit = 10 | Negative numbers allowed</div>
  </main>

  <script>

    let count = 0;

    const counterValueEl = document.getElementById('counterValue');
    const decreaseBtn = document.getElementById('decreaseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const increaseBtn = document.getElementById('increaseBtn');
    const limitAlertEl = document.getElementById('limitAlert');

    function updateDisplay() {
      counterValueEl.textContent = count;

      const textColor = count > 0 ? '#16a34a' : (count < 0 ? '#dc2626' : '#1e293b');
      counterValueEl.style.color = textColor;

      increaseBtn.disabled = count >= 10 ? true : false;

      limitAlertEl.className = count >= 10 ? 'limit-alert visible' : 'limit-alert';
    }

    decreaseBtn.addEventListener('click', () => {
      count--;
      updateDisplay();
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      updateDisplay();
    });

    increaseBtn.addEventListener('click', () => {
      if (count < 10) {
        count++;
        updateDisplay();
      }
    });

    updateDisplay();
  </script>

</body>
</html>
