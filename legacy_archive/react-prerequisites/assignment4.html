<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Todo List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2.5rem 1rem;
    }

    .todo-card {
      width: 100%;
      max-width: 520px;
      background-color: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border: 1px solid #f1f5f9;
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .remaining-badge {
      font-size: 0.85rem;
      font-weight: 600;
      background-color: #eff6ff;
      color: #2563eb;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid #dbeafe;
    }

    .todo-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .todo-input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .todo-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .add-btn {
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .add-btn:hover {
      background-color: #1d4ed8;
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    .input-error {
      min-height: 20px;
      font-size: 0.825rem;
      color: #dc2626;
      margin-bottom: 1rem;
      display: block;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .todo-item:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }

    .todo-checkbox {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      font-size: 0.95rem;
      color: #1e293b;
      word-break: break-word;
      transition: color 0.2s ease, text-decoration 0.2s ease;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      font-size: 0.85rem;
      border-radius: 6px;
      margin-left: 0.5rem;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .delete-btn:hover {
      color: #dc2626;
      background-color: #fee2e2;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #94a3b8;
    }

    .empty-state-icon {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .empty-state-text {
      font-size: 0.95rem;
      color: #64748b;
    }

    @media (prefers-reduced-motion: reduce) {
      .todo-input,
      .add-btn,
      .todo-item,
      .delete-btn {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <main class="todo-card">

    <header class="header-section">
      <h1 class="app-title">Task Master</h1>
      <span id="remainingCount" class="remaining-badge" aria-live="polite">0 tasks remaining</span>
    </header>

    <form id="todoForm" class="todo-form">
      <input 
        type="text" 
        id="taskInput" 
        class="todo-input" 
        placeholder="What needs to be done?" 
        aria-label="New task description"
        autocomplete="off"
      >
      <button type="submit" class="add-btn">Add Task</button>
    </form>
    <span id="inputError" class="input-error" role="alert"></span>

    <ul id="todoList" class="todo-list" aria-label="Todo list"></ul>
  </main>

  <script>

    let todos = [
      { id: 1, text: "Revise JavaScript ES6 fundamentals", done: false },
      { id: 2, text: "Practice Array methods (map, filter, reduce)", done: true }
    ];

    const todoForm = document.getElementById('todoForm');
    const taskInput = document.getElementById('taskInput');
    const inputError = document.getElementById('inputError');
    const todoList = document.getElementById('todoList');
    const remainingCountEl = document.getElementById('remainingCount');

    function render() {

      const remainingCount = todos.filter(todo => !todo.done).length;
      remainingCountEl.textContent = `${remainingCount} ${remainingCount === 1 ? 'task' : 'tasks'} remaining`;

      if (todos.length === 0) {
        todoList.innerHTML = `
          <li class="empty-state">
            <span class="empty-state-icon" aria-hidden="true">📝</span>
            <p class="empty-state-text">No tasks yet! Add a new task above to get started.</p>
          </li>
        `;
        return;
      }

      todoList.innerHTML = todos.map(todo => `
        <li class="todo-item ${todo.done ? 'completed' : ''}" data-id="${todo.id}">
          <div class="todo-left">
            <input 
              type="checkbox" 
              class="todo-checkbox" 
              data-id="${todo.id}" 
              ${todo.done ? 'checked' : ''} 
              aria-label="Mark '${todo.text.replace(/"/g, '&quot;')}' as complete"
            >
            <span class="todo-text">${escapeHtml(todo.text)}</span>
          </div>
          <button 
            type="button" 
            class="delete-btn" 
            data-id="${todo.id}" 
            aria-label="Delete task '${todo.text.replace(/"/g, '&quot;')}'"
          >
            Delete
          </button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function addTask(text) {
      const trimmedText = text.trim();
      if (!trimmedText) {
        inputError.textContent = "Please enter a task before adding.";
        return;
      }
      inputError.textContent = "";

      const newTask = {
        id: Date.now(),
        text: trimmedText,
        done: false
      };

      todos = [...todos, newTask];
      taskInput.value = "";
      render();
    }

    function toggleTask(id) {
      todos = todos.map(todo => 
        todo.id === id ? { ...todo, done: !todo.done } : todo
      );
      render();
    }

    function deleteTask(id) {
      todos = todos.filter(todo => todo.id !== id);
      render();
    }

    todoForm.addEventListener('submit', (event) => {
      event.preventDefault();
      addTask(taskInput.value);
    });

    taskInput.addEventListener('input', () => {
      if (inputError.textContent) {
        inputError.textContent = "";
      }
    });

    todoList.addEventListener('click', (event) => {
      const target = event.target;
      const id = Number(target.getAttribute('data-id'));

      if (!id) return;

      if (target.classList.contains('todo-checkbox')) {
        toggleTask(id);
      } else if (target.classList.contains('delete-btn')) {
        deleteTask(id);
      }
    });

    render();
  </script>

</body>
</html>
