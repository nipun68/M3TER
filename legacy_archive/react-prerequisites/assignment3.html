<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 - Dark and Light Theme Toggle</title>
  <style>

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #e2e8f0;
      --shadow-color: rgba(15, 23, 42, 0.08);
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --btn-hover: #334155;
      --accent: #3b82f6;
    }

    body.dark-theme {
      --bg-color: #090d16;
      --card-bg: #131b2e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #1e293b;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --btn-bg: #3b82f6;
      --btn-text: #ffffff;
      --btn-hover: #60a5fa;
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 1.5rem;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .theme-card {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 30px var(--shadow-color);
      border: 1px solid var(--border-color);
      transition: background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      background-color: rgba(59, 130, 246, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      transition: color 0.35s ease, background-color 0.35s ease;
    }

    .heading {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
      transition: color 0.35s ease;
    }

    .description {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      transition: color 0.35s ease;
    }

    .theme-toggle-btn {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--btn-text);
      background-color: var(--btn-bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .theme-toggle-btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
    }

    .theme-toggle-btn:active {
      transform: translateY(0);
    }

    .theme-toggle-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .theme-card,
      .theme-toggle-btn,
      .heading,
      .description {
        transition: none !important;
      }
      .theme-toggle-btn:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <main class="theme-card">
    <span class="badge">Theme Switcher</span>

    <h1 class="heading">Experience Light &amp; Dark Mode</h1>

    <p class="description">
      Toggle between daytime clarity and comfortable nighttime reading. This demonstration uses CSS custom properties, classList toggling, and JavaScript ternary operators.
    </p>

    <button type="button" id="themeToggleBtn" class="theme-toggle-btn">
      Switch to Dark
    </button>
  </main>

  <script>

    const themeToggleBtn = document.getElementById('themeToggleBtn');

    themeToggleBtn.addEventListener('click', () => {

      const isDark = document.body.classList.toggle('dark-theme');

      themeToggleBtn.textContent = isDark ? 'Switch to Light' : 'Switch to Dark';
    });
  </script>

</body>
</html>
