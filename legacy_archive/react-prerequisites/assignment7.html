<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 7 - Users from an API</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      padding: 2.5rem 1.25rem;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    .controls-bar {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .sort-btn {
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .sort-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .sort-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .status-container {
      text-align: center;
      padding: 4rem 1.5rem;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      margin: 0 auto 1.25rem auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .status-desc {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .retry-btn {
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .retry-btn:hover {
      background-color: #1d4ed8;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .user-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .user-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(15, 23, 42, 0.1);
    }

    .avatar-badge {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 0.25rem;
    }

    .user-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .user-info-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #475569;
      word-break: break-all;
    }

    .user-info-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
      .user-card {
        transition: none;
      }
      .user-card:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Directory of Users</h1>
      <p>Demonstrating async/await, try/catch, object destructuring, and client-side filtering</p>
    </header>

    <div class="controls-bar">
      <div class="search-box">
        <input 
          type="search" 
          id="searchInput" 
          class="search-input" 
          placeholder="Filter users by name while typing..." 
          aria-label="Search users by name"
        >
      </div>
      <button type="button" id="sortBtn" class="sort-btn">
        Sort Alphabetically: A &rarr; Z
      </button>
    </div>

    <div id="statusContainer" class="status-container" style="display: none;"></div>

    <main id="userGrid" class="user-grid" aria-live="polite"></main>
  </div>

  <script>

    let allUsers = [];
    let currentFilter = '';
    let isSortedAsc = false;

    const userGrid = document.getElementById('userGrid');
    const statusContainer = document.getElementById('statusContainer');
    const searchInput = document.getElementById('searchInput');
    const sortBtn = document.getElementById('sortBtn');

    function showLoading() {
      userGrid.style.display = 'none';
      statusContainer.style.display = 'block';
      statusContainer.innerHTML = `
        <div class="spinner" aria-hidden="true"></div>
        <h2 class="status-title">Loading Users...</h2>
        <p class="status-desc">Fetching directory from remote API.</p>
      `;
    }

    function showError(message) {
      userGrid.style.display = 'none';
      statusContainer.style.display = 'block';
      statusContainer.innerHTML = `
        <h2 class="status-title" style="color: #dc2626;">Unable to Load Users</h2>
        <p class="status-desc">${message}</p>
        <button type="button" class="retry-btn" onclick="fetchUsers()">Retry Request</button>
      `;
    }

    function getInitials(name) {
      if (!name) return 'U';
      const parts = name.trim().split(' ');
      return parts.length >= 2 
        ? `${parts[0][0]}${parts[parts.length - 1][0]}`.toUpperCase()
        : name.slice(0, 2).toUpperCase();
    }

    function renderUsers() {

      let displayedUsers = allUsers.filter(user => 
        user.name.toLowerCase().includes(currentFilter.toLowerCase().trim())
      );

      if (isSortedAsc) {
        displayedUsers = [...displayedUsers].sort((a, b) => 
          a.name.localeCompare(b.name)
        );
      }

      if (displayedUsers.length === 0) {
        userGrid.style.display = 'none';
        statusContainer.style.display = 'block';
        statusContainer.innerHTML = `
          <h2 class="status-title">No Users Found</h2>
          <p class="status-desc">No users matched your search term "${escapeHtml(currentFilter)}". Try a different name.</p>
        `;
        return;
      }

      statusContainer.style.display = 'none';
      userGrid.style.display = 'grid';

      userGrid.innerHTML = displayedUsers.map((user) => {

        const { name, email, address: { city } } = user;

        return `
          <article class="user-card">
            <div class="avatar-badge" aria-hidden="true">${getInitials(name)}</div>
            <h2 class="user-name">${escapeHtml(name)}</h2>
            <div class="user-info-row">
              <span class="user-info-icon" aria-hidden="true">✉</span>
              <span>${escapeHtml(email)}</span>
            </div>
            <div class="user-info-row">
              <span class="user-info-icon" aria-hidden="true">📍</span>
              <span>${escapeHtml(city)}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function fetchUsers() {
      showLoading();
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status} (${response.statusText})`);
        }
        const data = await response.json();
        allUsers = data;
        renderUsers();
      } catch (err) {
        console.error('Fetch error:', err);
        showError(err.message || 'A network error occurred while contacting the server.');
      }
    }

    searchInput.addEventListener('input', (event) => {
      currentFilter = event.target.value;
      renderUsers();
    });

    sortBtn.addEventListener('click', () => {
      isSortedAsc = !isSortedAsc;
      sortBtn.classList.toggle('active', isSortedAsc);
      sortBtn.textContent = isSortedAsc ? 'Sorted: A → Z (Click to Reset)' : 'Sort Alphabetically: A → Z';
      renderUsers();
    });

    fetchUsers();
  </script>

</body>
</html>
