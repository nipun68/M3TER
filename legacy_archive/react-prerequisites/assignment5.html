<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 5 - Product List with Filter and Sort</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0f172a;
      padding: 2.5rem 1.5rem;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .header p {
      color: #64748b;
      font-size: 0.975rem;
    }

    .controls-panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      background-color: #f8fafc;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .filter-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .sort-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    .sort-select {
      padding: 0.5rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #ffffff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .sort-select:focus {
      border-color: #2563eb;
    }

    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }

    .items-count {
      color: #1e40af;
      font-weight: 600;
    }

    .total-price-wrapper {
      color: #1e40af;
      font-weight: 600;
    }

    .total-price-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1d4ed8;
      margin-left: 0.35rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(15, 23, 42, 0.1);
    }

    .product-top {
      margin-bottom: 1rem;
    }

    .product-category-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #2563eb;
      background-color: #eff6ff;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.4;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid #f1f5f9;
      margin-top: 1rem;
    }

    .price-label {
      font-size: 0.8rem;
      color: #64748b;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
      background: #ffffff;
      border-radius: 16px;
      border: 1px dashed #cbd5e1;
    }

    @media (prefers-reduced-motion: reduce) {
      .product-card,
      .filter-btn {
        transition: none;
      }
      .product-card:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Product Catalog</h1>
      <p>Demonstrating map(), filter(), sort(), and reduce() with object destructuring</p>
    </header>

    <div class="controls-panel">

      <div class="filter-group" id="filterContainer" role="group" aria-label="Category filters">
        <button type="button" class="filter-btn active" data-category="All">All Products</button>
        <button type="button" class="filter-btn" data-category="Electronics">Electronics</button>
        <button type="button" class="filter-btn" data-category="Furniture">Furniture</button>
        <button type="button" class="filter-btn" data-category="Clothing">Clothing</button>
        <button type="button" class="filter-btn" data-category="Accessories">Accessories</button>
      </div>

      <div class="sort-group">
        <label for="sortSelect" class="sort-label">Sort by:</label>
        <select id="sortSelect" class="sort-select">
          <option value="none">Default Order</option>
          <option value="asc">Price: Low to High</option>
          <option value="desc">Price: High to Low</option>
        </select>
      </div>
    </div>

    <div class="summary-bar">
      <span id="itemsCount" class="items-count">Showing 9 products</span>
      <div class="total-price-wrapper">
        <span>Total Value:</span>
        <span id="totalPrice" class="total-price-value">$0.00</span>
      </div>
    </div>

    <main id="productGrid" class="product-grid" aria-live="polite"></main>
  </div>

  <script>

    const products = [
      { id: 1, name: "Wireless Noise-Canceling Headphones", category: "Electronics", price: 199.99 },
      { id: 2, name: "Mechanical Gaming Keyboard", category: "Electronics", price: 89.99 },
      { id: 3, name: "Ultra-Wide Gaming Monitor 34\"", category: "Electronics", price: 449.99 },
      { id: 4, name: "Ergonomic Mesh Office Chair", category: "Furniture", price: 249.50 },
      { id: 5, name: "Solid Oak Standing Desk", category: "Furniture", price: 399.00 },
      { id: 6, name: "Organic Cotton Casual T-Shirt", category: "Clothing", price: 29.99 },
      { id: 7, name: "Weatherproof Winter Jacket", category: "Clothing", price: 129.95 },
      { id: 8, name: "Minimalist Leather Backpack", category: "Accessories", price: 79.50 },
      { id: 9, name: "Smart Fitness Watch", category: "Electronics", price: 159.00 }
    ];

    let selectedCategory = "All";
    let selectedSort = "none";

    const productGrid = document.getElementById('productGrid');
    const filterContainer = document.getElementById('filterContainer');
    const sortSelect = document.getElementById('sortSelect');
    const itemsCountEl = document.getElementById('itemsCount');
    const totalPriceEl = document.getElementById('totalPrice');

    function updateProductDisplay() {

      let filteredProducts = selectedCategory === "All"
        ? [...products]
        : products.filter(product => product.category === selectedCategory);

      if (selectedSort === "asc") {
        filteredProducts = [...filteredProducts].sort((a, b) => a.price - b.price);
      } else if (selectedSort === "desc") {
        filteredProducts = [...filteredProducts].sort((a, b) => b.price - a.price);
      }

      const total = filteredProducts.reduce((accumulator, product) => {
        return accumulator + product.price;
      }, 0);

      itemsCountEl.textContent = `Showing ${filteredProducts.length} ${filteredProducts.length === 1 ? 'product' : 'products'}`;
      totalPriceEl.textContent = `$${total.toFixed(2)}`;

      if (filteredProducts.length === 0) {
        productGrid.innerHTML = `
          <div class="empty-message">
            <p>No products match the selected filters.</p>
          </div>
        `;
        return;
      }

      productGrid.innerHTML = filteredProducts.map(({ name, category, price }) => `
        <article class="product-card">
          <div class="product-top">
            <span class="product-category-tag">${category}</span>
            <h2 class="product-name">${name}</h2>
          </div>
          <div class="product-bottom">
            <span class="price-label">Price</span>
            <span class="product-price">$${price.toFixed(2)}</span>
          </div>
        </article>
      `).join('');
    }

    filterContainer.addEventListener('click', (event) => {
      const button = event.target.closest('.filter-btn');
      if (!button) return;

      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');

      selectedCategory = button.getAttribute('data-category');
      updateProductDisplay();
    });

    sortSelect.addEventListener('change', (event) => {
      selectedSort = event.target.value;
      updateProductDisplay();
    });

    updateProductDisplay();
  </script>

</body>
</html>
