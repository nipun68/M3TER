[project]
name = "m3ter-engine"
version = "1.0.0"
description = "M3TER — Enterprise-grade Usage-Based Pricing, Metering, Entitlement & Billing Engine in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pymongo>=4.9.0",
    "stripe>=10.0.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
